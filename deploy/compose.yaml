# 从源码构建的覆盖文件 —— 维护者通道，不是新用户的部署入口。
#
# 新用户只需要仓库根目录那一份 compose.yaml（拉现成镜像）。这一份叠在它上面，把同一个服务改成
# 「用本仓库的源码构建成本地镜像」，让「改完代码立刻在一台真实机器上跑起来」这件事仍然只有一个入口：
#
#   docker compose -f compose.yaml -f deploy/compose.yaml up -d --build
#
# 用法（维护者，见 tools/deploy/deploy.ps1，那才是真正在用的那条路径）：
#   先在 deploy/.env 里指定两个绝对目录（DM_CONFIG_DIR / DM_DATA_DIR），然后
#   docker compose --env-file deploy/.env -f compose.yaml -f deploy/compose.yaml up -d --build
#
# 与根目录那份的唯一差别就是下面两行：镜像改成构建产物并打上本地标签。
# 服务定义、端口、健康检查、挂载、环境变量全部只有一份，写在 compose.yaml 里 —— 两份文件各自维护
# 端口和挂载是上一次部署里最容易被改漏的地方。

services:
  app:
    # 本地标签保留原名：tools/deploy/deploy.ps1 的「删旧镜像 → 构建 → 起新镜像」纪律，以及它在首次
    # 绑定挂载部署时用来搬运命名卷的 root 辅助容器，都按这个名字找镜像。
    image: dailymusings/server:local

    build:
      # 整个仓库都是构建上下文：服务端引用其余全部项目。.dockerignore 已经把 tests/docs/本地状态排除掉。
      context: ..
      dockerfile: deploy/Dockerfile
