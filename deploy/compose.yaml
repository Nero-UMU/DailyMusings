# 每日随想 — single-instance self-hosted deployment (docs/开发指导.md §3.1, §14).
#
# Run from the repository root:
#   docker compose -f deploy/compose.yaml up -d --build
#
# Read the generated administrator password once, at first start:
#   docker compose -f deploy/compose.yaml logs app | grep INITIAL-ADMIN-PASSWORD

name: dailymusings

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: dailymusings/server:local

    # §14: multi-instance deployment is NOT supported. The database-backed queue assumes one executor, so this
    # service must never be scaled out. Do not add `deploy.replicas` or `--scale` here.
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Storage__RootPath: /var/lib/dailymusings
      Storage__SecretsPath: /run/secrets
      Storage__KeyRingPath: /var/lib/dailymusings-keys

    ports:
      # §10.3 recommends HTTPS, a LAN or a VPN. If this port is exposed to the public internet over plain
      # HTTP, the login page states the interception risk and requires an explicit acknowledgement — and that
      # acknowledgement protects nothing. Prefer a TLS-terminating reverse proxy in front of this service.
      - "${DAILYMUSINGS_HTTP_PORT:-8080}:8080"

    volumes:
      # Everything durable: SQLite database, audio, exports, Markdown output and backups. This is the backup set.
      - dailymusings-state:/var/lib/dailymusings

      # The DataProtection key ring, kept out of the backup set on purpose: it signs the administrator's auth
      # cookies, so a backup containing it would be a way to forge a session (§10.4, decision A.13). It is
      # persisted at all so that recreating the container does not silently log the operator out.
      - dailymusings-keys:/var/lib/dailymusings-keys

    secrets:
      # Names only. Values are read from files at run time and never appear in configuration, logs or backups.
      - openai-api-key
      - embedding-api-key
      - smtp-password
      - wordpress-application-password

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  dailymusings-state:
  dailymusings-keys:

# Copy deploy/secrets.example/* into deploy/secrets/ and fill in real values before starting.
# deploy/secrets/ is gitignored on purpose.
secrets:
  openai-api-key:
    file: ./secrets/openai-api-key
  embedding-api-key:
    file: ./secrets/embedding-api-key
  smtp-password:
    file: ./secrets/smtp-password
  wordpress-application-password:
    file: ./secrets/wordpress-application-password
