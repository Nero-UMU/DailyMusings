# 发布流程：把「新用户只写一份 compose.yaml + 装一个 APK」这件事真正变成可用的东西。
#
# 三件事，按需要各自独立：
#   image        打 tag 时构建 linux/amd64 + linux/arm64 两个架构的镜像并推到 ghcr.io
#   apk          构建 Release 签名的 Android APK
#   compose-smoke 用仓库根目录那一份 compose.yaml 真的把实例起起来，再按绑定挂载的方式起第二次
#
# smoke 那一步是这一轮的验收本体：它用的就是新用户会拿到的那份文件，没有 .env、没有 secret 文件、没有预先
# 建目录。它同时验证了「镜像构建得出来」「健康检查会变绿」「一次性管理员密码被打印」「绑定挂载目录的属主被
# 纠正」「服务进程不是 root」。这些在这台开发机上都没有 Docker 可跑，所以只能在这里跑。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/nero-umu/dailymusings

jobs:
  image:
    name: 构建并推送多架构镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 MAUI Android 工作负载
        run: dotnet workload install maui-android

      - name: 写入发布签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail

          # 这一步故意「缺了就失败」。此前没有密钥，构建在全新 runner 上自动生成了一把 Android 调试密钥，
          # 于是每次发布的签名都不一样，手机上永远装不上新版本（见 docs/开发指导.md 附录 A.30）。
          # 与其再发出一份装不上的 APK，不如让发布停下来。
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error title=缺少签名密钥::ANDROID_SIGNING_KEYSTORE_BASE64 没设置。在本机跑 tools/release/new-signing-key.ps1，把打印出来的 4 条 Secret 与 1 条 Variable 填进仓库设置。"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "keystore 已写入（$(stat -c '%s' "$RUNNER_TEMP/release.keystore") 字节）"

          # 先花 5 秒证明这把 keystore 与口令/别名配得上，而不是等构建跑完 20 分钟才发现打不开。
          # 任何失败都要写成 ::error:: 注解：注解在公开仓库可读，日志在未登录/限流时读不到，
          # 而「沉默的失败」正是上一轮卡住的原因。
          if ! listing="$(keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
                -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" 2>&1)"; then
            echo "::error title=密钥或口令对不上::keytool 打不开这把 keystore（别名 ${SIGNING_KEY_ALIAS}）。检查 ANDROID_SIGNING_STORE_PASSWORD / ANDROID_SIGNING_KEY_ALIAS / ANDROID_SIGNING_KEYSTORE_BASE64 是否来自同一次脚本输出。keytool 说：$(printf '%s' "$listing" | tail -3 | tr '\n' ' ')"
            exit 1
          fi

          echo "keystore 可用：$(printf '%s' "$listing" | grep -m1 -i 'SHA256:' || echo '（keytool 未列出指纹）')"

      - name: 由 tag 推导 Android 版本号
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
            echo "name=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
            # versionCode 是整数且必须单调递增，手机才肯覆盖安装（否则报「应用未安装」）。
            # 语义化版本映射成 major*10000 + minor*100 + patch：1.0.3 → 10003。
            echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"
          else
            # 手动触发跑在分支上：用 csproj 里的默认值，不假装成一个版本号。
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "code=" >> "$GITHUB_OUTPUT"
            echo "not a version tag ('${GITHUB_REF_NAME}'), keeping the project defaults"
          fi
          cat "$GITHUB_OUTPUT"

      # 必须是 Release：Debug 版依赖 Fast Deployment，APK 里不含程序集，单独安装会以
      # 「No assemblies found」启动失败（docs/发布校验值.md）。
      - name: 构建签名 APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${SIGNING_STORE_PASSWORD}" ] || [ -z "${SIGNING_KEY_ALIAS}" ] || [ -z "${SIGNING_KEY_PASSWORD}" ]; then
            echo "::error::签名密钥的密码/别名不完整：需要 ANDROID_SIGNING_STORE_PASSWORD、ANDROID_SIGNING_KEY_ALIAS、ANDROID_SIGNING_KEY_PASSWORD。"
            exit 1
          fi

          extra=()
          if [ -n "$VERSION_NAME" ]; then
            extra+=("-p:ApplicationDisplayVersion=$VERSION_NAME" "-p:ApplicationVersion=$VERSION_CODE")
          fi

          dotnet build src/DailyMusings.Client/DailyMusings.Client.csproj \
            -f net10.0-android -c Release -t:SignAndroidPackage \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore" \
            -p:AndroidSigningStorePass="$SIGNING_STORE_PASSWORD" \
            -p:AndroidSigningKeyAlias="$SIGNING_KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$SIGNING_KEY_PASSWORD" \
            "${extra[@]}"

      - name: 改名并算 SHA-256
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.name }}"
          [ -n "$version" ] || version="0.0.0-dev"
          apk="DailyMusings-client-${version}-android.apk"
          cp src/DailyMusings.Client/bin/Release/net10.0-android/dev.dailymusings.client-Signed.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"

      # 签名「没报错」不等于「用的是那把密钥」：构建在找不到密钥时会静默退回调试密钥（主题 CN=Android Debug），
      # 而那正是这一版要杜绝的事。所以这里读回证书主题与指纹，和仓库变量比对。
      #
      # 刻意写成平铺的一段（没有函数、没有复合语句），并且**每一步都先打印再做判断**：上一版用了 fail() 函数
      # 加 set -e，结果这一步在 CI 里 1 秒失败、连一行输出都没有，而 GitHub 的日志又读不到——那是最难查的
      # 一种失败。现在无论哪一步出错，输出都在它前面一行。
      - name: 校验签名证书
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          version="${{ steps.version.outputs.name }}"
          if [ -z "$version" ]; then version="0.0.0-dev"; fi
          apk="DailyMusings-client-${version}-android.apk"

          echo "开始校验 $apk"
          echo "工作目录内容："
          ls -la *.apk 2>/dev/null || echo "  （当前目录没有 .apk 文件）"
          echo "证书变量：${EXPECTED_CERT_SHA256:-（空）}"

          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Android SDK：$sdk"

          apksigner="$(find "$sdk/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -1)"
          echo "apksigner：${apksigner:-（没找到）}"

          if [ ! -f "$apk" ]; then
            echo "::error title=找不到 APK 产物::期望 $apk，但当前目录里没有它。"
            exit 1
          fi

          if [ -z "$apksigner" ]; then
            echo "::error title=找不到 apksigner::在 $sdk/build-tools 下没有 apksigner。"
            exit 1
          fi

          echo "--- apksigner verify --print-certs 的输出 ---"
          "$apksigner" verify --print-certs "$apk"
          status=$?
          echo "--- 退出码 $status ---"

          if [ "$status" -ne 0 ]; then
            echo "::error title=apksigner 校验失败::退出码 $status（见上方输出）。"
            exit 1
          fi

          certs="$("$apksigner" verify --print-certs "$apk" 2>&1)"
          dn="$(printf '%s\n' "$certs" | grep -m1 'Signer #1 certificate DN' | sed 's/.*DN: //')"
          actual="$(printf '%s\n' "$certs" | grep -m1 'Signer #1 certificate SHA-256 digest' | awk '{print $NF}' | tr 'A-F' 'a-f')"

          echo "证书主题   ：${dn:-（读不出）}"
          echo "实际指纹   ：${actual:-（读不出）}"

          if [ -z "$actual" ]; then
            echo "::error title=读不出证书指纹::apksigner 的输出里没有指纹行。"
            exit 1
          fi

          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::error title=缺少仓库变量::ANDROID_SIGNING_CERT_SHA256 没设置（它是 Variable，不是 Secret）。本次指纹是 $actual。"
            exit 1
          fi

          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            if printf '%s' "$dn" | grep -qi 'Android Debug'; then
              echo "::error title=构建没用上发布密钥::产物是调试签名（$dn，指纹 $actual）。要修的是构建，不是变量。"
              exit 1
            fi

            echo "::error title=签名指纹与变量不一致::产物由「$dn」签名，指纹 $actual；变量里是 $EXPECTED_CERT_SHA256。把变量改成 $actual。"
            exit 1
          fi

          echo "签名校验通过：$dn"
          {
            echo "### APK 签名"
            echo ""
            echo "- 证书主题：\`$dn\`"
            echo "- 证书 SHA-256：\`$actual\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 即使校验失败也把产物传上来：失败的那次跑最容易需要「它到底被谁签的」，而 GitHub 的日志在未登录或
      # 限流时读不到。产物只是 Actions artifact（不是 Release），会过期，留在那里当证据没有代价。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: |
            DailyMusings-client-*-android.apk
            DailyMusings-client-*-android.apk.sha256

  compose-smoke:
    name: 用仓库根的 compose.yaml 起一次实例
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建本地镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: dailymusings-smoke:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 只用 compose.yaml 起服务（零配置：没有 .env、没有 secrets、没有预建目录）
        env:
          DM_IMAGE: dailymusings-smoke:local
          DM_ADMIN_PASSWORD: SmokeTestPassword1
        run: |
          set -euo pipefail
          docker compose up -d

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18321/api/system/health >/dev/null 2>&1; then break; fi
            sleep 2
          done

          echo "-- 健康检查（来自镜像的 HEALTHCHECK，compose 文件里已经没有这一段）--"
          curl -fsS http://127.0.0.1:18321/api/system/health; echo
          curl -fsS http://127.0.0.1:18321/api/system/health | grep -q '"healthy":true'

          # 镜像 HEALTHCHECK 的 start_period 是 30s，而上面的 HTTP 探针几秒内就通了——所以这里必须等，
          # 不能探针一通就断言 healthy（第一次运行就是这么挂的：status 还是 starting）。
          # 用 compose ps -q 取容器 id：compose 里写了 container_name，名字不再带项目前缀。
          cid="$(docker compose ps -q app)"
          status=""
          for _ in $(seq 1 30); do
            status="$(docker inspect "$cid" --format '{{.State.Health.Status}}')"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          if [ "$status" != "healthy" ]; then
            echo "容器健康状态是 '$status'，最近几条健康检查输出：" >&2
            docker inspect "$cid" --format '{{range .State.Health.Log}}{{.ExitCode}} {{.Output}}{{end}}' >&2
            docker compose logs app | tail -n 40 >&2
            exit 1
          fi
          echo "镜像 HEALTHCHECK 报告 $status"

          echo "-- 默认目录由容器自己建好并纠正属主 --"
          stat -c '%u %n' ./data ./config
          [ "$(stat -c '%u' ./data)" = "1654" ]
          [ "$(stat -c '%u' ./config)" = "1654" ]

          echo "-- 部署配置里的初始密码被采用，且没有回显到容器输出里 --"
          docker compose logs app | grep -q '部署配置'
          if docker compose logs app | grep -q 'SmokeTestPassword1'; then
            echo "容器输出里出现了部署配置的密码，这是不允许的" >&2
            exit 1
          fi

          echo "-- 服务进程不是 root（PID 1 的 uid 应当是 1654）--"
          # stdin 显式指向 /dev/null：exec 类命令会继承并消费 stdin，在「脚本从 stdin 读入」的
          # 调用方式下会把剩下的脚本吃掉（在真实服务器上踩过一次，脚本静默半途结束、退出码还是 0）。
          docker compose exec -T app cat /proc/1/status </dev/null | grep -q '^Uid:.*1654'

          echo "-- 端口锁真的生效（compose 传进去的 DM_LOCK_LISTENING_PORT 与容器里读的是同一个名字）--"
          # 这一段是这次改名的验收本体：环境变量名写错时，「锁没生效」不会让别的断言变红。
          cookie="$(mktemp)"
          curl -fsS -o /dev/null -c "$cookie" -X POST \
            -d "username=admin&password=SmokeTestPassword1&acknowledgeRisk=yes" \
            http://127.0.0.1:18321/api/admin/sign-in
          # 首次登录强制改密；改密会让旧会话失效，所以下面要重新登录一次。
          curl -fsS -o /dev/null -b "$cookie" -c "$cookie" -X POST \
            -d "currentPassword=SmokeTestPassword1&newUsername=owner&newPassword=CorrectHorseBattery1&confirmPassword=CorrectHorseBattery1" \
            http://127.0.0.1:18321/api/admin/credentials
          curl -fsS -o /dev/null -c "$cookie" -X POST \
            -d "username=owner&password=CorrectHorseBattery1&acknowledgeRisk=yes" \
            http://127.0.0.1:18321/api/admin/sign-in

          port="$(curl -fsS -b "$cookie" http://127.0.0.1:18321/api/system/listening-port)"
          echo "  $port"
          echo "$port" | grep -q '"locked":true'

          code="$(curl -s -o /dev/null -w '%{http_code}' -b "$cookie" -X PATCH \
            -H 'Content-Type: application/json' -d '{"port":19464}' \
            http://127.0.0.1:18321/api/system/listening-port)"
          echo "  PATCH 改端口 -> HTTP $code（应当是 409）"
          [ "$code" = "409" ]

          echo "-- 被拒绝的写入没有在磁盘上留下任何东西 --"
          docker compose exec -T app sh -c 'test ! -e /var/lib/dailymusings-config/runtime.json' </dev/null
          rm -f "$cookie"

      - name: 把两个目录指到别处再起一次（DM_DATA_DIR / DM_CONFIG_DIR）
        env:
          DM_IMAGE: dailymusings-smoke:local
          DM_ADMIN_PASSWORD: SmokeTestPassword1
          DM_DATA_DIR: ${{ github.workspace }}/smoke/data
          DM_CONFIG_DIR: ${{ github.workspace }}/smoke/config
        run: |
          set -euo pipefail
          docker compose down -v

          # 故意不创建这两个目录：它们由容器创建，属主也由容器纠正。
          docker compose up -d

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18321/api/system/health >/dev/null 2>&1; then break; fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:18321/api/system/health | grep -q '"healthy":true'

          echo "-- 指定的两个目录的属主已经被纠正为容器用户 --"
          stat -c '%u %n' "$DM_DATA_DIR" "$DM_CONFIG_DIR"
          [ "$(stat -c '%u' "$DM_DATA_DIR")" = "1654" ]
          [ "$(stat -c '%u' "$DM_CONFIG_DIR")" = "1654" ]

          echo "-- 失败时留下现场 --"
          docker compose logs app | tail -n 40

  release:
    name: 建 Release 并附上 APK
    needs: [apk, compose-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          # 文件名算出来，不用 glob：glob 不匹配时 bash 会把模式原样传下去，于是 gh 报的是
          # 「文件不存在」，看起来像发布权限问题，实际是产物没到这一步。
          apk="DailyMusings-client-${version}-android.apk"
          sha="${apk}.sha256"
          ls -la
          [ -f "$apk" ] || { echo "缺少 $apk：构建产物没有传到这一层" >&2; exit 1; }
          [ -f "$sha" ] || { echo "缺少 $sha" >&2; exit 1; }

          {
            echo "## 手机端"
            echo
            echo "下载下面的 \`*.apk\` 安装即可（Android 8.0 / API 26 及以上，系统会提示「未知来源」）。"
            echo
            echo "## 服务端"
            echo
            echo "只需要一份 compose 文件："
            echo
            echo '```bash'
            echo "curl -fsSLO https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${tag}/compose.yaml"
            echo "docker compose up -d"
            echo "docker compose logs app | grep INITIAL-ADMIN-PASSWORD"
            echo '```'
            echo
            echo "镜像：\`${IMAGE}:${version}\`（linux/amd64、linux/arm64，公开包，无需登录即可拉取）。"
            echo "换端口/换数据目录在同一个文件里改 \`DM_PORT\` / \`DM_DATA_DIR\` / \`DM_CONFIG_DIR\`。"
            echo
            echo "## 校验值"
            echo
            echo '```'
            cat "$sha"
            echo '```'
          } > notes.md
          cat notes.md

          # -R 不是装饰：这一步没有 checkout，cwd 不是 git 仓库，gh 自己推断不出仓库，
          # 于是第一次运行的「建 Release」就是这样失败的（镜像与 APK 都成功，只有这一步红）。
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$sha" -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk" "$sha" \
              -R "$GITHUB_REPOSITORY" \
              --title "每日随想 $tag" \
              --notes-file notes.md
          fi
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json tagName,url,assets
